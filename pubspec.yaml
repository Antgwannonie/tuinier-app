name: tuinier_app
description: Tuinier-app — groente-database met verzorging en teeltperiodes.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  timezone: ^0.10.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  image: ^4.5.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/vegetables/
